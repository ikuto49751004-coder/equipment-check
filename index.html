<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チェックリスト管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const initialTargets = ['日常タスク', '買い物リスト', '旅行準備'];
    const initialItems = [
      { id: '1', target: '日常タスク', text: '部屋の掃除をする', checked: false },
      { id: '2', target: '日常タスク', text: 'メールの返信をする', checked: true },
      { id: '3', target: '買い物リスト', text: '牛乳を買う', checked: false },
      { id: '4', target: '買い物リスト', text: 'パンを買う', checked: false },
      { id: '5', target: '旅行準備', text: 'パスポートの確認', checked: true },
      { id: '6', target: '旅行準備', text: '着替えを詰める', checked: false }
    ];

    function App() {
      const [targets, setTargets] = useState(() => {
        const saved = localStorage.getItem('cl_targets');
        return saved ? JSON.parse(saved) : initialTargets;
      });
      const [items, setItems] = useState(() => {
        const saved = localStorage.getItem('cl_items');
        return saved ? JSON.parse(saved) : initialItems;
      });
      const [currentTarget, setCurrentTarget] = useState(() => {
        const saved = localStorage.getItem('cl_current_target');
        return saved && (saved === 'すべて' || targets.includes(saved)) ? saved : (targets[0] || 'すべて');
      });

      // 設定モーダル
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [settingsTab, setSettingsTab] = useState('items'); // 'items' | 'targets'

      // 編集用状態
      const [newItemText, setNewItemText] = useState('');
      const [newTargetName, setNewTargetName] = useState('');
      const [editingItemId, setEditingItemId] = useState(null);
      const [editingItemText, setEditingItemText] = useState('');

      useEffect(() => {
        localStorage.setItem('cl_targets', JSON.stringify(targets));
      }, [targets]);

      useEffect(() => {
        localStorage.setItem('cl_items', JSON.stringify(items));
      }, [items]);

      useEffect(() => {
        localStorage.setItem('cl_current_target', currentTarget);
      }, [currentTarget]);

      const toggleCheck = (id) => {
        setItems(items.map(item => item.id === id ? { ...item, checked: !item.checked } : item));
      };

      // チェックのリセット
      const resetChecks = () => {
        if (confirm(`「${currentTarget}」のチェックをすべて外しますか？`)) {
          setItems(items.map(item => {
            if (currentTarget === 'すべて' || item.target === currentTarget) {
              return { ...item, checked: false };
            }
            return item;
          }));
        }
      };

      const filteredItems = currentTarget === 'すべて'
        ? items
        : items.filter(item => item.target === currentTarget);

      const completedCount = filteredItems.filter(i => i.checked).length;
      const progress = filteredItems.length > 0 ? Math.round((completedCount / filteredItems.length) * 100) : 0;

      const addItem = (e) => {
        e.preventDefault();
        if (!newItemText.trim()) return;
        const targetToAssign = currentTarget === 'すべて' ? (targets[0] || '未分類') : currentTarget;
        const newItem = {
          id: Date.now().toString(),
          target: targetToAssign,
          text: newItemText.trim(),
          checked: false
        };
        setItems([...items, newItem]);
        setNewItemText('');
      };

      const startEditItem = (item) => {
        setEditingItemId(item.id);
        setEditingItemText(item.text);
      };

      const saveEditItem = (id) => {
        if (!editingItemText.trim()) return;
        setItems(items.map(item => item.id === id ? { ...item, text: editingItemText.trim() } : item));
        setEditingItemId(null);
      };

      const deleteItem = (id) => {
        setItems(items.filter(item => item.id !== id));
      };

      const changeItemTarget = (id, newTarget) => {
        setItems(items.map(item => item.id === id ? { ...item, target: newTarget } : item));
      };

      const addTarget = (e) => {
        e.preventDefault();
        if (!newTargetName.trim() || targets.includes(newTargetName.trim())) return;
        const newT = newTargetName.trim();
        setTargets([...targets, newT]);
        setNewTargetName('');
        setCurrentTarget(newT);
      };

      const deleteTarget = (targetName) => {
        if (targets.length <= 1) {
          alert('対象（グループ）は最低1つ必要です。');
          return;
        }
        if (confirm(`「${targetName}」を削除しますか？紐づく項目も削除されます。`)) {
          setTargets(targets.filter(t => t !== targetName));
          setItems(items.filter(i => i.target !== targetName));
          if (currentTarget === targetName) {
            setCurrentTarget(targets.find(t => t !== targetName) || 'すべて');
          }
        }
      };

      return (
        <div className="max-w-xl mx-auto p-4 sm:p-6 min-h-screen flex flex-col justify-between">
          <div>
            {/* ヘッダー */}
            <div className="bg-white rounded-2xl shadow-sm p-5 mb-4 border border-slate-200">
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center gap-2">
                  <i className="fa-solid fa-square-check text-indigo-600 text-2xl"></i>
                  <h1 className="text-xl font-bold text-slate-800">チェックリスト</h1>
                </div>
                
                {/* 歯車ボタン */}
                <button
                  onClick={() => setIsSettingsOpen(true)}
                  className="p-2.5 rounded-full text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 transition-colors"
                  title="対象・項目編集（設定）"
                >
                  <i className="fa-solid fa-gear text-xl"></i>
                </button>
              </div>

              {/* 対象タブ */}
              <div className="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
                <button
                  onClick={() => setCurrentTarget('すべて')}
                  className={`px-3.5 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-all ${
                    currentTarget === 'すべて'
                      ? 'bg-indigo-600 text-white shadow-sm'
                      : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }`}
                >
                  すべて
                </button>
                {targets.map(t => (
                  <button
                    key={t}
                    onClick={() => setCurrentTarget(t)}
                    className={`px-3.5 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-all ${
                      currentTarget === t
                        ? 'bg-indigo-600 text-white shadow-sm'
                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                    }`}
                  >
                    {t}
                  </button>
                ))}
              </div>

              {/* 進捗とリセットボタン */}
              <div className="mt-4 pt-4 border-t border-slate-100 flex items-center justify-between">
                <div className="flex-1 mr-4">
                  <div className="flex justify-between text-xs text-slate-500 font-medium mb-1">
                    <span>完了 ({completedCount}/{filteredItems.length})</span>
                    <span>{progress}%</span>
                  </div>
                  <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                    <div
                      className="bg-indigo-600 h-2 rounded-full transition-all duration-300"
                      style={{ width: `${progress}%` }}
                    ></div>
                  </div>
                </div>

                {/* リセットボタン */}
                <button
                  onClick={resetChecks}
                  disabled={filteredItems.length === 0}
                  className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg bg-amber-50 text-amber-700 hover:bg-amber-100 active:bg-amber-200 disabled:opacity-40 disabled:pointer-events-none transition-colors border border-amber-200/60"
                  title="チェックを一括で外す"
                >
                  <i className="fa-solid fa-rotate-left"></i>
                  リセット
                </button>
              </div>
            </div>

            {/* チェックリスト本体 */}
            <div className="space-y-2">
              {filteredItems.length === 0 ? (
                <div className="bg-white rounded-2xl p-8 text-center text-slate-400 border border-slate-200">
                  <i className="fa-regular fa-clipboard text-4xl mb-2 text-slate-300"></i>
                  <p className="text-sm">表示できる項目がありません</p>
                </div>
              ) : (
                filteredItems.map(item => (
                  <div
                    key={item.id}
                    onClick={() => toggleCheck(item.id)}
                    className={`group bg-white rounded-xl p-3.5 border transition-all cursor-pointer flex items-center justify-between select-none ${
                      item.checked
                        ? 'border-slate-200 bg-slate-50/70 text-slate-400'
                        : 'border-slate-200 hover:border-indigo-300 shadow-sm text-slate-700'
                    }`}
                  >
                    <div className="flex items-center gap-3 flex-1 min-w-0 pr-2">
                      <div className={`w-5 h-5 rounded border flex items-center justify-center transition-colors ${
                        item.checked
                          ? 'bg-indigo-600 border-indigo-600 text-white'
                          : 'border-slate-300 group-hover:border-indigo-400 bg-white'
                      }`}>
                        {item.checked && <i className="fa-solid fa-check text-xs"></i>}
                      </div>
                      <span className={`text-sm break-words flex-1 ${item.checked ? 'line-through' : 'font-medium'}`}>
                        {item.text}
                      </span>
                    </div>

                    {currentTarget === 'すべて' && (
                      <span className="text-[10px] px-2 py-0.5 rounded-md bg-slate-100 text-slate-500 font-medium whitespace-nowrap">
                        {item.target}
                      </span>
                    )}
                  </div>
                ))
              )}
            </div>
          </div>

          {/* クイック追加入力 */}
          <form onSubmit={addItem} className="mt-4 flex gap-2">
            <input
              type="text"
              placeholder={`「${currentTarget === 'すべて' ? (targets[0] || '項目') : currentTarget}」に項目を追加...`}
              value={newItemText}
              onChange={(e) => setNewItemText(e.target.value)}
              className="flex-1 px-4 py-2.5 rounded-xl border border-slate-300 bg-white shadow-sm text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
            <button
              type="submit"
              className="px-4 py-2.5 bg-indigo-600 text-white font-medium rounded-xl shadow-sm hover:bg-indigo-700 transition-colors flex items-center gap-1.5 text-sm"
            >
              <i className="fa-solid fa-plus"></i>
              追加
            </button>
          </form>

          {/* 歯車設定モーダル */}
          {isSettingsOpen && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-lg rounded-2xl shadow-xl border border-slate-200 overflow-hidden flex flex-col max-h-[85vh]">
                
                <div className="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                  <div className="flex items-center gap-2">
                    <i className="fa-solid fa-gear text-indigo-600"></i>
                    <h2 className="font-bold text-slate-800">設定・編集</h2>
                  </div>
                  <button
                    onClick={() => setIsSettingsOpen(false)}
                    className="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:bg-slate-200 hover:text-slate-600 transition-colors"
                  >
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                {/* タブ切り替え */}
                <div className="flex border-b border-slate-200 bg-slate-100/60 p-1 gap-1">
                  <button
                    onClick={() => setSettingsTab('items')}
                    className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${
                      settingsTab === 'items'
                        ? 'bg-white text-indigo-600 shadow-sm'
                        : 'text-slate-500 hover:text-slate-700'
                    }`}
                  >
                    <i className="fa-solid fa-pen-to-square mr-1.5"></i>
                    項目編集
                  </button>
                  <button
                    onClick={() => setSettingsTab('targets')}
                    className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${
                      settingsTab === 'targets'
                        ? 'bg-white text-indigo-600 shadow-sm'
                        : 'text-slate-500 hover:text-slate-700'
                    }`}
                  >
                    <i className="fa-solid fa-folder-open mr-1.5"></i>
                    対象（グループ）編集
                  </button>
                </div>

                <div className="p-5 overflow-y-auto flex-1 space-y-4">
                  {/* 項目編集タブ */}
                  {settingsTab === 'items' && (
                    <div className="space-y-3">
                      <div className="text-xs text-slate-500 flex justify-between items-center mb-1">
                        <span>全 {items.length} 項目</span>
                        <span>対象の移動・テキスト修正・削除</span>
                      </div>

                      {items.length === 0 ? (
                        <p className="text-center text-sm text-slate-400 py-6">項目がありません</p>
                      ) : (
                        items.map(item => (
                          <div key={item.id} className="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                            <div className="flex items-center gap-2">
                              {editingItemId === item.id ? (
                                <input
                                  type="text"
                                  value={editingItemText}
                                  onChange={(e) => setEditingItemText(e.target.value)}
                                  className="flex-1 px-2.5 py-1 text-sm border border-indigo-400 rounded bg-white focus:outline-none"
                                  autoFocus
                                />
                              ) : (
                                <span className="flex-1 text-sm font-medium text-slate-700">{item.text}</span>
                              )}

                              {editingItemId === item.id ? (
                                <button
                                  onClick={() => saveEditItem(item.id)}
                                  className="px-2.5 py-1 text-xs bg-indigo-600 text-white rounded font-medium hover:bg-indigo-700"
                                >
                                  保存
                                </button>
                              ) : (
                                <button
                                  onClick={() => startEditItem(item)}
                                  className="p-1.5 text-slate-400 hover:text-indigo-600 transition-colors"
                                  title="名前を変更"
                                >
                                  <i className="fa-solid fa-pen"></i>
                                </button>
                              )}

                              <button
                                onClick={() => deleteItem(item.id)}
                                className="p-1.5 text-slate-400 hover:text-rose-600 transition-colors"
                                title="削除"
                              >
                                <i className="fa-solid fa-trash-can"></i>
                              </button>
                            </div>

                            <div className="flex items-center gap-2 pt-1 border-t border-slate-200/60 text-xs">
                              <span className="text-slate-400">所属対象:</span>
                              <select
                                value={item.target}
                                onChange={(e) => changeItemTarget(item.id, e.target.value)}
                                className="bg-white border border-slate-200 rounded px-2 py-1 text-xs text-slate-600 focus:outline-none focus:border-indigo-500"
                              >
                                {targets.map(t => (
                                  <option key={t} value={t}>{t}</option>
                                ))}
                              </select>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  )}

                  {/* 対象編集タブ */}
                  {settingsTab === 'targets' && (
                    <div className="space-y-4">
                      <form onSubmit={addTarget} className="flex gap-2">
                        <input
                          type="text"
                          placeholder="新しい対象名（例: 買い物、仕事など）"
                          value={newTargetName}
                          onChange={(e) => setNewTargetName(e.target.value)}
                          className="flex-1 px-3.5 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        />
                        <button
                          type="submit"
                          className="px-4 py-2 bg-indigo-600 text-white font-medium rounded-xl text-sm hover:bg-indigo-700"
                        >
                          追加
                        </button>
                      </form>

                      <div className="space-y-2">
                        <p className="text-xs text-slate-500">既存の対象一覧</p>
                        {targets.map(t => (
                          <div key={t} className="flex items-center justify-between p-3 bg-slate-50 border border-slate-200 rounded-xl">
                            <span className="text-sm font-medium text-slate-700">{t}</span>
                            <div className="flex items-center gap-2">
                              <span className="text-xs text-slate-400">
                                ({items.filter(i => i.target === t).length} 項目)
                              </span>
                              <button
                                onClick={() => deleteTarget(t)}
                                className="p-1.5 text-slate-400 hover:text-rose-600 transition-colors"
                                title="対象を削除"
                              >
                                <i className="fa-solid fa-trash-can"></i>
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                <div className="p-4 border-t border-slate-100 bg-slate-50/50 flex justify-end">
                  <button
                    onClick={() => setIsSettingsOpen(false)}
                    className="px-5 py-2 bg-slate-800 text-white font-medium text-sm rounded-xl hover:bg-slate-900 transition-colors"
                  >
                    完了
                  </button>
                </div>

              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
```eof

### 主な追加・改善内容

1. **「リセット」ボタンの追加**
   - 上部の進捗バー横にある「リセット」ボタンを押すと、現在選択している対象（または全体）のチェック状態をまとめてオフに戻せます。
2. **歯車アイコン内への機能格納**
   - **「項目編集」タブ**: 項目のテキスト変更、削除、別の対象（グループ）への変更移動ができます。
   - **「対象編集」タブ**: 新しい対象（カテゴリ/グループ）の追加や削除ができます。
3. **ローカルストレージ保存機能**
   - リセットや編集した内容は自動的に保存され、ページをリロードしても維持されます。
