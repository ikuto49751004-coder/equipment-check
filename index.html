<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設備・工具自主検査アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col max-w-lg mx-auto border-x border-slate-200 relative pb-24">

    <!-- Header -->
    <header class="bg-indigo-900 text-white p-4 sticky top-0 z-30 shadow-md">
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-base font-bold flex items-center gap-2">
                <i class="fa-solid fa-clipboard-check text-emerald-400"></i>
                設備・工具点検システム
            </h1>
            <div class="flex items-center gap-2">
                <span id="header-period-badge" class="text-xs bg-indigo-800 text-indigo-200 px-2.5 py-1 rounded-full border border-indigo-700 font-medium">
                    2026年度 上期
                </span>
                <button onclick="openSettingsModal()" class="w-8 h-8 rounded-full bg-indigo-800 hover:bg-indigo-700 text-indigo-200 flex items-center justify-center transition" title="設定・リセット">
                    <i class="fa-solid fa-gear text-sm"></i>
                </button>
            </div>
        </div>
        
        <div id="month-buttons-container" class="flex gap-1.5 overflow-x-auto no-scrollbar pt-1 text-xs font-semibold">
        </div>
    </header>

    <!-- Main Navigation Tabs -->
    <nav class="bg-white border-b border-slate-200 p-2 flex text-xs font-bold gap-1 sticky top-[90px] z-20 shadow-sm">
        <button onclick="switchMainTab('check')" id="tab-check" class="flex-1 py-2 rounded-lg bg-indigo-900 text-white text-center shadow">
            <i class="fa-solid fa-pen-to-square mr-1"></i>点検入力
        </button>
        <button onclick="switchMainTab('master')" id="tab-master" class="flex-1 py-2 rounded-lg text-slate-600 text-center hover:bg-slate-100">
            <i class="fa-solid fa-sliders mr-1"></i>対象・項目編集
        </button>
        <button onclick="switchMainTab('report')" id="tab-report" class="flex-1 py-2 rounded-lg text-slate-600 text-center hover:bg-slate-100">
            <i class="fa-solid fa-paper-plane mr-1"></i>結果・送信
        </button>
    </nav>

    <!-- Content Area -->
    <main class="p-3 flex-1 space-y-4">

        <!-- 1. 点検入力 VIEW -->
        <div id="view-check" class="space-y-3">
            <div class="bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-[11px] font-bold text-slate-500 mb-1.5 flex justify-between items-center">
                    <span><i class="fa-regular fa-file-lines mr-1"></i>シートページ選択 (全7ページ)</span>
                    <span id="page-staff-display" class="text-indigo-600">担当: 設定なし</span>
                </div>
                <div class="grid grid-cols-7 gap-1 text-xs font-bold text-center" id="page-buttons-container">
                </div>
            </div>

            <div id="equipment-cards-container" class="space-y-3"></div>
        </div>

        <!-- 2. マスター編集 VIEW -->
        <div id="view-master" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
                <h3 class="font-bold text-sm text-indigo-900 flex items-center gap-2">
                    <i class="fa-solid fa-user-gear"></i> ページ担当者設定
                </h3>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div>
                        <label class="block text-slate-500 mb-1">対象ページ</label>
                        <select id="edit-page-select" onchange="loadPageStaffConfig()" class="w-full p-2 border border-slate-300 rounded-lg bg-slate-50 font-bold">
                            <option value="1">1 ページ</option>
                            <option value="2">2 ページ</option>
                            <option value="3">3 ページ</option>
                            <option value="4">4 ページ</option>
                            <option value="5">5 ページ</option>
                            <option value="6">6 ページ</option>
                            <option value="7">7 ページ</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-500 mb-1">正担当 / 副担当 (2名)</label>
                        <input type="text" id="staff-input" placeholder="例: 山田(正) / 佐藤(副)" class="w-full p-2 border border-slate-300 rounded-lg">
                    </div>
                </div>
                <button onclick="saveStaffConfig()" class="w-full bg-slate-800 text-white font-bold py-1.5 rounded-lg text-xs hover:bg-slate-700">
                    このページの担当者を保存
                </button>
            </div>

            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
                <h3 class="font-bold text-sm text-indigo-900 flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle"></i> 点検対象・項目の追加
                </h3>
                <form onsubmit="handleAddEquipment(event)" class="space-y-2 text-xs">
                    <div>
                        <label class="block text-slate-500 mb-1">追加先ページ</label>
                        <select id="add-target-page" class="w-full p-2 border border-slate-300 rounded-lg bg-slate-50 font-bold">
                            <option value="1">1 ページ</option>
                            <option value="2">2 ページ</option>
                            <option value="3">3 ページ</option>
                            <option value="4">4 ページ</option>
                            <option value="5">5 ページ</option>
                            <option value="6">6 ページ</option>
                            <option value="7">7 ページ</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-500 mb-1">設備・工具名</label>
                        <input type="text" id="new-eq-name" required placeholder="例: 天井クレーン(小) 1.5t" class="w-full p-2 border border-slate-300 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-slate-500 mb-1">点検項目（改行で複数指定）</label>
                        <textarea id="new-eq-items" rows="3" required placeholder="① 走行時異音は無いか&#10;② ブレーキは問題無いか" class="w-full p-2 border border-slate-300 rounded-lg"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-indigo-900 text-white font-bold py-2 rounded-lg hover:bg-indigo-800">
                        このページに対象を追加
                    </button>
                </form>
            </div>

            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
                <h3 class="font-bold text-sm text-slate-700">登録済み設備一覧</h3>
                <div id="master-list-display" class="space-y-2 text-xs divide-y divide-slate-100"></div>
            </div>
        </div>

        <!-- 3. 結果・送信 VIEW -->
        <div id="view-report" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center space-y-2">
                <div class="text-xs text-slate-500 font-bold">点検達成率</div>
                <div id="overall-progress-text" class="text-3xl font-extrabold text-indigo-900">0%</div>
                <p id="report-subtext" class="text-[11px] text-slate-400">全7ページ・今月の点検データ集計結果</p>
                <div id="uninspection-alert" class="hidden text-xs bg-amber-50 border border-amber-300 text-amber-800 p-2 rounded-lg font-bold">
                    ⚠️ 未点検の項目が残っています！
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
                <h3 class="font-bold text-sm text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-envelope-open-text text-indigo-600"></i> 部長へ点検結果をメール報告
                </h3>
                <div>
                    <label class="block text-xs text-slate-500 mb-1">部長のメールアドレス</label>
                    <input type="email" id="manager-email" placeholder="bucho@example.com" class="w-full p-2 text-xs border border-slate-300 rounded-lg">
                </div>
                <button onclick="sendManagerEmail()" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-lg text-xs shadow hover:bg-emerald-700 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> メール作成画面を開く
                </button>
            </div>

            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
                <h3 class="font-bold text-sm text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-file-excel text-emerald-600"></i> データ保存・出力
                </h3>
                <button onclick="exportCSV()" class="w-full bg-slate-800 text-white font-bold py-2 rounded-lg text-xs shadow hover:bg-slate-700 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-download"></i> 点検まとめデータをダウンロード (CSV)
                </button>
            </div>
        </div>

    </main>

    <!-- Bottom Bar -->
    <div class="fixed bottom-0 left-0 right-0 max-w-lg mx-auto bg-white border-t border-slate-200 p-3 flex justify-between items-center shadow-lg z-30">
        <div class="text-xs">
            <span class="text-slate-500">点検完了: </span>
            <span id="completed-counter" class="font-bold text-indigo-900">0 / 0</span>
            <span id="save-status-text" class="block text-[10px] text-emerald-600 font-bold mt-0.5">
                <i class="fa-solid fa-circle-check"></i> 自動保存済み
            </span>
        </div>
        <button onclick="manualSaveData()" class="bg-indigo-900 hover:bg-indigo-800 text-white text-xs font-bold px-5 py-2.5 rounded-lg shadow flex items-center gap-1.5">
            <i class="fa-solid fa-floppy-disk"></i> このページを保存
        </button>
    </div>
    <!-- 歯車（設定・リセット）モーダル -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-xs w-full p-4 shadow-2xl space-y-4 relative">
            <div class="flex justify-between items-center border-b pb-2">
                <h4 class="font-bold text-sm text-indigo-900 flex items-center gap-1.5">
                    <i class="fa-solid fa-sliders"></i> 設定・システムリセット
                </h4>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 text-sm">✕</button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-500 font-bold mb-1">点検年度</label>
                    <select id="setting-year" class="w-full p-2 border border-slate-300 rounded-lg font-bold bg-slate-50"></select>
                </div>
                <div>
                    <label class="block text-slate-500 font-bold mb-1">期区分</label>
                    <select id="setting-term" onchange="onTermChangeInModal()" class="w-full p-2 border border-slate-300 rounded-lg font-bold bg-slate-50">
                        <option value="上期" selected>上期 (4月〜9月)</option>
                        <option value="下期">下期 (10月〜3月)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-slate-500 font-bold mb-1">選択月</label>
                    <select id="setting-month" class="w-full p-2 border border-slate-300 rounded-lg font-bold bg-slate-50"></select>
                </div>
            </div>

            <!-- リセットセクション -->
            <div class="border-t pt-3 mt-3">
                <label class="block text-slate-500 font-bold text-xs mb-1">データ管理</label>
                <button onclick="resetAllData()" class="w-full py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 font-bold rounded-lg text-xs flex items-center justify-center gap-1.5 transition">
                    <i class="fa-solid fa-rotate-left"></i> 全データを初期化（リセット）
                </button>
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="closeSettingsModal()" class="flex-1 py-2 bg-slate-100 text-slate-600 font-bold rounded-lg text-xs">キャンセル</button>
                <button onclick="applySettingsModal()" class="flex-1 py-2 bg-indigo-900 text-white font-bold rounded-lg text-xs shadow hover:bg-indigo-800">変更を適用</button>
            </div>
        </div>
    </div>

    <!-- NG Reason & Photo Modal -->
    <div id="ng-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-xs w-full p-4 shadow-2xl space-y-3 relative max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-2">
                <h4 class="font-bold text-sm text-rose-600 flex items-center gap-1.5">
                    <i class="fa-solid fa-triangle-exclamation"></i> NG理由・写真登録
                </h4>
                <button onclick="closeNgModal()" class="text-slate-400 hover:text-slate-600 text-sm">✕</button>
            </div>
            <div class="space-y-1">
                <label class="text-[11px] text-slate-500 font-bold">クイック選択</label>
                <div class="flex flex-wrap gap-1 text-xs">
                    <button onclick="addNgTag('異音あり')" class="px-2 py-1 bg-slate-100 rounded hover:bg-rose-100 hover:text-rose-700 border">異音あり</button>
                    <button onclick="addNgTag('破損・傷みあり')" class="px-2 py-1 bg-slate-100 rounded hover:bg-rose-100 hover:text-rose-700 border">破損・傷みあり</button>
                    <button onclick="addNgTag('汚れ・油漏れ')" class="px-2 py-1 bg-slate-100 rounded hover:bg-rose-100 hover:text-rose-700 border">汚れ・油漏れ</button>
                    <button onclick="addNgTag('動作不調')" class="px-2 py-1 bg-slate-100 rounded hover:bg-rose-100 hover:text-rose-700 border">動作不調</button>
                </div>
            </div>
            <div>
                <label class="text-[11px] text-slate-500 font-bold">詳細メモ</label>
                <textarea id="ng-reason-text" rows="2" placeholder="具体箇所や状況を入力してください" class="w-full text-xs p-2 border border-slate-300 rounded-lg mt-1 focus:ring-2 focus:ring-rose-500 focus:outline-none"></textarea>
            </div>

            <!-- 現場写真添付領域（任意） -->
            <div>
                <label class="text-[11px] text-slate-500 font-bold block mb-1">
                    不具合写真の添付 <span class="text-slate-400 font-normal">（任意）</span>
                </label>
                <input type="file" id="ng-photo-input" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoSelect(event)">
                <button onclick="document.getElementById('ng-photo-input').click()" class="w-full py-2 bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-lg text-xs font-bold text-slate-700 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-camera text-indigo-600"></i> 写真を撮影・選択
                </button>
                <div id="ng-photo-preview-container" class="mt-2 hidden relative">
                    <img id="ng-photo-preview" class="w-full h-32 object-cover rounded-lg border">
                    <button onclick="removeNgPhoto()" class="absolute top-1 right-1 bg-rose-600 text-white rounded-full w-6 h-6 text-xs font-bold shadow">✕</button>
                </div>
            </div>

            <div class="flex gap-2 pt-1">
                <button onclick="closeNgModal()" class="flex-1 py-2 bg-slate-100 text-slate-600 font-bold rounded-lg text-xs">キャンセル</button>
                <button onclick="confirmNgReason()" class="flex-1 py-2 bg-rose-600 text-white font-bold rounded-lg text-xs shadow hover:bg-rose-700">NGで決定</button>
            </div>
        </div>
    </div>

    <script>
        let currentYear = '2026年度';
        let currentTerm = '上期';
        let currentMonth = '4月';
        let currentPage = 1;
        let activeNgKey = null;
        let tempPhotoData = '';

        const termMonths = {
            '上期': ['4月', '5月', '6月', '7月', '8月', '9月'],
            '下期': ['10月', '11月', '12月', '1月', '2月', '3月']
        };

        const defaultMasterData = {
            pages: {
                1: { staff: '山田(正) / 佐藤(副)', equipment: [
                    { id: 'eq_1_1', name: '電動フォークリフト', items: [
                        { id: 'i_1_1_1', text: '① 設備始業点検表で問題は発生していないか' },
                        { id: 'i_1_1_2', text: '② 始業前点検は確実に行われているか' },
                        { id: 'i_1_1_3', text: '③ 年次点検日はすぎていないか' }
                    ]}
                ]},
                2: { staff: '田中(正) / 鈴木(副)', equipment: [
                    { id: 'eq_2_1', name: '天井クレーン(大) 2t', items: [
                        { id: 'i_2_1_1', text: '① 走行時異音は無いか' },
                        { id: 'i_2_1_2', text: '② ブレーキは問題無いか' },
                        { id: 'i_2_1_3', text: '③ ワイヤーに傷み・ねじれは無いか' }
                    ]},
                    { id: 'eq_2_2', name: 'VAC扉ドッキング治具', items: [
                        { id: 'i_2_2_1', text: '① 移動キャスターに問題は無いか' },
                        { id: 'i_2_2_2', text: '② 上下動作に問題は無いか' }
                    ]}
                ]},
                3: { staff: '未定', equipment: [] },
                4: { staff: '未定', equipment: [] },
                5: { staff: '未定', equipment: [] },
                6: { staff: '未定', equipment: [] },
                7: { staff: '未定', equipment: [] }
            }
        };

        let masterData = JSON.parse(JSON.stringify(defaultMasterData));
        let inspectionResults = {};

        document.addEventListener('DOMContentLoaded', () => {
            loadStorageData();
            generateYearOptions();
            updateHeaderDisplay();
            renderMonthButtons();
            renderPageButtons();
            renderCurrentPage();
            renderMasterList();
            updateProgress();
        });

        function loadStorageData() {
            const savedMaster = localStorage.getItem('inspection_master_v3');
            const savedResults = localStorage.getItem('inspection_results_v3');
            const savedConfig = localStorage.getItem('inspection_config_v3');

            if (savedMaster) masterData = JSON.parse(savedMaster);
            if (savedResults) inspectionResults = JSON.parse(savedResults);
            if (savedConfig) {
                const conf = JSON.parse(savedConfig);
                currentYear = conf.year || '2026年度';
                currentTerm = conf.term || '上期';
                currentMonth = conf.month || (currentTerm === '上期' ? '4月' : '10月');
            }
        }

        function generateYearOptions() {
            const yearSelect = document.getElementById('setting-year');
            const currentRealYear = new Date().getFullYear();
            const startYear = currentRealYear - 1;
            const endYear = currentRealYear + 10;

            let optionsHtml = '';
            for (let y = startYear; y <= endYear; y++) {
                const val = `${y}年度`;
                optionsHtml += `<option value="${val}">${val}</option>`;
            }
            yearSelect.innerHTML = optionsHtml;
        }

        function autoSaveStorage() {
            localStorage.setItem('inspection_master_v3', JSON.stringify(masterData));
            localStorage.setItem('inspection_results_v3', JSON.stringify(inspectionResults));
            localStorage.setItem('inspection_config_v3', JSON.stringify({
                year: currentYear,
                term: currentTerm,
                month: currentMonth
            }));

            const statusTxt = document.getElementById('save-status-text');
            if (statusTxt) {
                statusTxt.innerHTML = `<i class="fa-solid fa-circle-check"></i> 自動保存済み (${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})})`;
            }
        }

        function manualSaveData() {
            autoSaveStorage();
            alert(`${currentPage}ページの入力データを保存しました！`);
        }

        // 全データのリセット処理
        function resetAllData() {
            if (confirm('すべての入力データ・点検結果・追加した設備設定を削除して初期状態に戻しますか？')) {
                localStorage.removeItem('inspection_master_v3');
                localStorage.removeItem('inspection_results_v3');
                localStorage.removeItem('inspection_config_v3');

                masterData = JSON.parse(JSON.stringify(defaultMasterData));
                inspectionResults = {};
                currentYear = '2026年度';
                currentTerm = '上期';
                currentMonth = '4月';
                currentPage = 1;

                closeSettingsModal();
                updateHeaderDisplay();
                renderMonthButtons();
                renderPageButtons();
                renderCurrentPage();
                renderMasterList();
                updateProgress();

                alert('すべてのデータを初期化しました。');
            }
        }

        function updateHeaderDisplay() {
            document.getElementById('header-period-badge').innerText = `${currentYear} ${currentTerm}`;
        }

        function renderMonthButtons() {
            const container = document.getElementById('month-buttons-container');
            const months = termMonths[currentTerm];

            if (!months.includes(currentMonth)) {
                currentMonth = months[0];
            }

            container.innerHTML = months.map(m => `
                <button onclick="selectMonth('${m}')" class="month-btn px-3 py-1 rounded-full ${m === currentMonth ? 'bg-emerald-500 text-white shadow' : 'bg-indigo-950/60 text-indigo-200 hover:bg-indigo-800'} shrink-0">
                    ${m}
                </button>
            `).join('');
        }

        function renderPageButtons() {
            const container = document.getElementById('page-buttons-container');
            let html = '';

            for (let p = 1; p <= 7; p++) {
                const status = getPageStatus(p);
                const isActive = p === currentPage;
                
                let badgeClass = 'bg-slate-300 text-slate-700';
                let badgeText = '空';

                if (status.total > 0) {
                    if (status.completed === status.total) {
                        badgeClass = 'bg-emerald-500 text-white';
                        badgeText = '済';
                    } else {
                        badgeClass = 'bg-amber-500 text-white animate-pulse';
                        badgeText = '未';
                    }
                }

                const activeClass = isActive 
                    ? 'bg-indigo-900 text-white shadow ring-2 ring-indigo-400' 
                    : 'bg-slate-100 text-slate-700 hover:bg-slate-200';

                html += `
                    <button onclick="selectPage(${p})" class="page-btn py-1.5 rounded-lg ${activeClass} relative flex flex-col items-center justify-center">
                        <span>${p}P</span>
                        <span class="text-[9px] px-1 rounded-full ${badgeClass} font-bold mt-0.5">${badgeText}</span>
                    </button>
                `;
            }
            container.innerHTML = html;
        }

        function getPageStatus(p) {
            let total = 0, completed = 0;
            const eqs = (masterData.pages[p] && masterData.pages[p].equipment) || [];
            eqs.forEach(eq => {
                eq.items.forEach(i => {
                    total++;
                    const key = `${currentYear}_${currentMonth}_${i.id}`;
                    if (inspectionResults[key] && inspectionResults[key].status) completed++;
                });
            });
            return { total, completed };
        }

        function getUninspectedCount() {
            let total = 0, completed = 0;
            Object.keys(masterData.pages).forEach(p => {
                masterData.pages[p].equipment.forEach(eq => {
                    eq.items.forEach(i => {
                        total++;
                        const key = `${currentYear}_${currentMonth}_${i.id}`;
                        if (inspectionResults[key] && inspectionResults[key].status) completed++;
                    });
                });
            });
            return { total, completed, uninspected: total - completed };
        }

        function selectMonth(m) {
            autoSaveStorage();
            currentMonth = m;
            renderMonthButtons();
            renderPageButtons();
            renderCurrentPage();
            updateProgress();
        }

        function selectPage(p) {
            autoSaveStorage();
            currentPage = p;
            renderPageButtons();
            renderCurrentPage();
        }

        function renderCurrentPage() {
            const pData = masterData.pages[currentPage] || { staff: '未定', equipment: [] };
            document.getElementById('page-staff-display').innerText = `担当: ${pData.staff}`;

            const container = document.getElementById('equipment-cards-container');
            container.innerHTML = '';

            if (pData.equipment.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-xs text-slate-400 bg-white rounded-xl border border-dashed">このページには点検対象が設定されていません。<br>「対象・項目編集」タブから追加できます。</div>`;
                return;
            }

            pData.equipment.forEach(eq => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden';

                let itemsHtml = eq.items.map(item => {
                    const key = `${currentYear}_${currentMonth}_${item.id}`;
                    const res = inspectionResults[key] || { status: '', reason: '', photo: '' };

                    return `
                        <div class="p-3 border-b border-slate-100 last:border-none space-y-2">
                            <p class="text-xs font-semibold text-slate-700">${item.text}</p>
                            <div class="flex gap-2">
                                <button onclick="setResult('${key}', 'OK')" class="flex-1 py-1.5 rounded-lg text-xs font-bold border transition ${res.status === 'OK' ? 'bg-emerald-600 text-white border-emerald-600 shadow' : 'bg-slate-50 text-slate-600 border-slate-200'}">
                                    <i class="fa-solid fa-check mr-1"></i>良 (OK)
                                </button>
                                <button onclick="openNgModal('${key}')" class="flex-1 py-1.5 rounded-lg text-xs font-bold border transition ${res.status === 'NG' ? 'bg-rose-600 text-white border-rose-600 shadow' : 'bg-slate-50 text-slate-600 border-slate-200'}">
                                    <i class="fa-solid fa-xmark mr-1"></i>否 (NG)
                                </button>
                            </div>
                            ${res.status === 'NG' ? `
                                <div class="text-[11px] bg-rose-50 border border-rose-200 text-rose-800 p-2 rounded-lg space-y-1">
                                    <div><strong>NG理由:</strong> ${res.reason || '指定なし'}</div>
                                    ${res.photo ? `<div class="mt-1"><img src="${res.photo}" class="h-20 rounded border object-cover"></div>` : ''}
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');

                card.innerHTML = `
                    <div class="bg-indigo-50/50 p-2.5 border-b border-slate-200 flex justify-between items-center">
                        <span class="font-bold text-xs text-indigo-950">${eq.name}</span>
                        <span class="text-[10px] text-indigo-600 bg-indigo-100 px-2 py-0.5 rounded-full font-semibold">${eq.items.length} 項目</span>
                    </div>
                    <div>${itemsHtml}</div>
                `;
                container.appendChild(card);
            });
        }

        function setResult(key, status) {
            inspectionResults[key] = { status: status, reason: '', photo: '' };
            autoSaveStorage();
            renderPageButtons();
            renderCurrentPage();
            updateProgress();
        }

        function openNgModal(key) {
            activeNgKey = key;
            const res = inspectionResults[key] || {};
            document.getElementById('ng-reason-text').value = res.reason || '';
            tempPhotoData = res.photo || '';

            const preview = document.getElementById('ng-photo-preview');
            const container = document.getElementById('ng-photo-preview-container');
            if (tempPhotoData) {
                preview.src = tempPhotoData;
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }

            document.getElementById('ng-modal').classList.remove('hidden');
        }

        function closeNgModal() {
            document.getElementById('ng-modal').classList.add('hidden');
            activeNgKey = null;
            tempPhotoData = '';
        }

        function addNgTag(tag) {
            const txt = document.getElementById('ng-reason-text');
            txt.value = txt.value ? `${txt.value}, ${tag}` : tag;
        }

        function handlePhotoSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                tempPhotoData = event.target.result;
                document.getElementById('ng-photo-preview').src = tempPhotoData;
                document.getElementById('ng-photo-preview-container').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function removeNgPhoto() {
            tempPhotoData = '';
            document.getElementById('ng-photo-preview-container').classList.add('hidden');
            document.getElementById('ng-photo-input').value = '';
        }

        function confirmNgReason() {
            if (!activeNgKey) return;
            const reason = document.getElementById('ng-reason-text').value.trim();
            inspectionResults[activeNgKey] = { status: 'NG', reason: reason, photo: tempPhotoData };
            autoSaveStorage();
            closeNgModal();
            renderPageButtons();
            renderCurrentPage();
            updateProgress();
        }

        function openSettingsModal() {
            document.getElementById('setting-year').value = currentYear;
            document.getElementById('setting-term').value = currentTerm;
            onTermChangeInModal();
            document.getElementById('setting-month').value = currentMonth;
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function onTermChangeInModal() {
            const term = document.getElementById('setting-term').value;
            const monthSelect = document.getElementById('setting-month');
            const months = termMonths[term];
            monthSelect.innerHTML = months.map(m => `<option value="${m}">${m}</option>`).join('');
        }

        function applySettingsModal() {
            currentYear = document.getElementById('setting-year').value;
            currentTerm = document.getElementById('setting-term').value;
            currentMonth = document.getElementById('setting-month').value;

            closeSettingsModal();
            updateHeaderDisplay();
            renderMonthButtons();
            renderPageButtons();
            renderCurrentPage();
            updateProgress();
            autoSaveStorage();
        }

        function switchMainTab(tab) {
            autoSaveStorage();
            document.getElementById('view-check').classList.add('hidden');
            document.getElementById('view-master').classList.add('hidden');
            document.getElementById('view-report').classList.add('hidden');

            document.getElementById('tab-check').className = 'flex-1 py-2 rounded-lg text-slate-600 text-center hover:bg-slate-100';
            document.getElementById('tab-master').className = 'flex-1 py-2 rounded-lg text-slate-600 text-center hover:bg-slate-100';
            document.getElementById('tab-report').className = 'flex-1 py-2 rounded-lg text-slate-600 text-center hover:bg-slate-100';

            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).className = 'flex-1 py-2 rounded-lg bg-indigo-900 text-white text-center shadow';

            if (tab === 'master') loadPageStaffConfig();
        }

        function updateProgress() {
            const stats = getUninspectedCount();

            document.getElementById('completed-counter').innerText = `${stats.completed} / ${stats.total}`;
            const pct = stats.total > 0 ? Math.round((stats.completed / stats.total) * 100) : 0;
            document.getElementById('overall-progress-text').innerText = `${pct}%`;

            const alertBox = document.getElementById('uninspection-alert');
            if (stats.uninspected > 0) {
                alertBox.innerText = `⚠️ 未点検の項目が ${stats.uninspected} 件残っています！`;
                alertBox.classList.remove('hidden');
            } else {
                alertBox.classList.add('hidden');
            }
        }

        function loadPageStaffConfig() {
            const p = document.getElementById('edit-page-select').value;
            document.getElementById('staff-input').value = masterData.pages[p].staff || '';
        }

        function saveStaffConfig() {
            const p = document.getElementById('edit-page-select').value;
            masterData.pages[p].staff = document.getElementById('staff-input').value.trim();
            autoSaveStorage();
            renderCurrentPage();
            alert(`${p}ページの担当者を保存しました！`);
        }

        function handleAddEquipment(e) {
            e.preventDefault();
            const targetP = document.getElementById('add-target-page').value;
            const name = document.getElementById('new-eq-name').value.trim();
            const itemsText = document.getElementById('new-eq-items').value.trim();

            const itemsArr = itemsText.split('\n').filter(t => t.trim()).map((t, idx) => ({
                id: `i_user_${Date.now()}_${idx}`,
                text: t.trim()
            }));

            masterData.pages[targetP].equipment.push({
                id: `eq_user_${Date.now()}`,
                name: name,
                items: itemsArr
            });

            document.getElementById('new-eq-name').value = '';
            document.getElementById('new-eq-items').value = '';
            autoSaveStorage();
            renderMasterList();
            renderPageButtons();
            renderCurrentPage();
            alert(`${targetP}ページに新しい設備を追加・保存しました！`);
        }

        function renderMasterList() {
            const container = document.getElementById('master-list-display');
            container.innerHTML = '';
            Object.keys(masterData.pages).forEach(p => {
                const eqs = masterData.pages[p].equipment;
                eqs.forEach(eq => {
                    const div = document.createElement('div');
                    div.className = 'pt-2 flex justify-between items-start';
                    div.innerHTML = `
                        <div>
                            <span class="font-bold text-slate-800">[${p}P] ${eq.name}</span>
                            <div class="text-[11px] text-slate-500">${eq.items.length} 項目</div>
                        </div>
                        <button onclick="removeEquipment(${p}, '${eq.id}')" class="text-rose-500 hover:text-rose-700 text-xs p-1">削除</button>
                    `;
                    container.appendChild(div);
                });
            });
        }

        function removeEquipment(page, eqId) {
            if (confirm('この設備と点検項目を削除しますか？')) {
                masterData.pages[page].equipment = masterData.pages[page].equipment.filter(e => e.id !== eqId);
                autoSaveStorage();
                renderMasterList();
                renderPageButtons();
                renderCurrentPage();
            }
        }

        function sendManagerEmail() {
            const email = document.getElementById('manager-email').value || '';
            let ngSummary = [];

            Object.keys(masterData.pages).forEach(p => {
                masterData.pages[p].equipment.forEach(eq => {
                    eq.items.forEach(i => {
                        const key = `${currentYear}_${currentMonth}_${i.id}`;
                        const res = inspectionResults[key];
                        if (res && res.status === 'NG') {
                            const hasPhoto = res.photo ? ' (写真添付あり)' : '';
                            ngSummary.push(`・[${p}P] ${eq.name} - ${i.text}\n  理由: ${res.reason || '記述なし'}${hasPhoto}`);
                        }
                    });
                });
            });

            const subject = encodeURIComponent(`【設備工具点検結果報告】${currentYear} ${currentTerm} (${currentMonth})`);
            let bodyText = `部長\n\nお疲れ様です。\n${currentYear} ${currentTerm}（${currentMonth}）の設備・工具点検結果をご報告いたします。\n\n`;
            bodyText += `■ 点検区分: ${currentYear} ${currentTerm} (${currentMonth})\n`;
            bodyText += `■ 要対応(NG)項目数: ${ngSummary.length} 件\n\n`;

            if (ngSummary.length > 0) {
                bodyText += `【不具合・要確認項目一覧】\n` + ngSummary.join('\n') + `\n\n`;
            } else {
                bodyText += `全点検項目において異常はありませんでした。\n\n`;
            }

            bodyText += `ご確認のほどよろしくお願いいたします。`;

            window.location.href = `mailto:${email}?subject=${subject}&body=${encodeURIComponent(bodyText)}`;
        }

        function exportCSV() {
            let csv = "年度,期区分,点検月,ページ,設備名,点検項目,結果,NG理由・メモ,写真添付\n";
            const allMonths = [...termMonths['上期'], ...termMonths['下期']];

            Object.keys(masterData.pages).forEach(p => {
                masterData.pages[p].equipment.forEach(eq => {
                    eq.items.forEach(i => {
                        allMonths.forEach(m => {
                            const key = `${currentYear}_${m}_${i.id}`;
                            const res = inspectionResults[key] || { status: '未点検', reason: '', photo: '' };
                            const photoFlag = res.photo ? 'あり' : 'なし';
                            csv += `"${currentYear}","${currentTerm}","${m}","${p}P","${eq.name}","${i.text}","${res.status}","${res.reason}","${photoFlag}"\n`;
                        });
                    });
                });
            });

            const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `設備工具点検結果_${currentYear}_${currentTerm}.csv`;
            link.click();
        }
    </script>
</body>
</html>
