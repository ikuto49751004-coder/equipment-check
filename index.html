<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設備・工具自主検査アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col max-w-lg mx-auto border-x border-slate-200 relative pb-24">

    <header class="bg-indigo-900 text-white p-4 sticky top-0 z-30 shadow-md">
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-base font-bold flex items-center gap-2">
                <i class="fa-solid fa-clipboard-check text-emerald-400"></i>
                設備・工具点検システム
            </h1>
            <div class="flex items-center gap-2">
                <span id="header-period-badge" class="text-xs bg-indigo-800 text-indigo-200 px-2.5 py-1 rounded-full border border-indigo-700 font-medium">
                    2026年度 上期
                </span>
                <button onclick="openSettingsModal()" class="w-8 h-8 rounded-full bg-indigo-800 hover:bg-indigo-700 text-indigo-200 flex items-center justify-center transition" title="年度・期間設定">
                    <i class="fa-solid fa-gear text-sm"></i>
                </button>
            </div>
        </div>
        
        <div id="month-buttons-container" class="flex gap-1.5 overflow-x-auto no-scrollbar pt-1 text-xs font-semibold">
            </div>
    </header>

    <nav class="bg-white border-b border-slate-200 p-2 flex text-xs font-bold gap-1 sticky top-[90px] z-20 shadow-sm">
        <button onclick="switchMainTab('check')" id="tab-check" class="flex-1 py-2 rounded-lg bg-indigo-900 text-white text-center shadow">
            <i class="fa-solid fa-pen-to-square mr-1"></i>点検入力
        </button>
        <button onclick="switchMainTab('master')" id="tab-master" class="flex-1 py-2 rounded-lg text-slate-600 text-center hover:bg-slate-100">
            <i class="fa-solid fa-sliders mr-1"></i>対象・項目編集
        </button>
        <button onclick="switchMainTab('report')" id="tab-report" class="flex-1 py-2 rounded-lg text-slate-600 text-center hover:bg-slate-100">
            <i class="fa-solid fa-paper-plane mr-1"></i>結果・送信
        </button>
    </nav>

    <main class="p-3 flex-1 space-y-4">

        <div id="view-check" class="space-y-3">
            
            <div class="bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-[11px] font-bold text-slate-500 mb-1.5 flex justify-between items-center">
                    <span><i class="fa-regular fa-file-lines mr-1"></i>シートページ選択 (全7ページ)</span>
                    <span id="page-staff-display" class="text-indigo-600">担当: 設定なし</span>
                </div>
                <div class="grid grid-cols-7 gap-1 text-xs font-bold text-center">
                    <button onclick="selectPage(1)" class="page-btn py-1.5 rounded-lg bg
